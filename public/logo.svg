<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="lfpt-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="lfpt-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#2563eb" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Logo Mark Icon -->
  <g filter="url(#glow)">
    <rect x="8" y="12" width="56" height="56" rx="14" fill="url(#lfpt-grad)" />
    <!-- Dynamic Flow Nodes and Arrow -->
    <path d="M26 48L36 38L42 44L52 30" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M44 30H52V38" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Pulse Node -->
    <circle cx="26" cy="48" r="3" fill="#ffffff" />
    <circle cx="36" cy="38" r="2.5" fill="#ffffff" />
    <circle cx="42" cy="44" r="2.5" fill="#ffffff" />
  </g>

  <!-- Brand Wordmark -->
  <text x="76" y="47" font-family="'Outfit', 'Inter', -apple-system, sans-serif" font-size="27" font-weight="800" fill="#0f172a" letter-spacing="-0.5">
    Lead<tspan fill="#2563eb">Flow</tspan><tspan fill="#0f172a" font-weight="700">Pro</tspan>
  </text>
  <rect x="256" y="27" width="46" height="19" rx="5" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1" />
  <text x="264" y="41" font-family="'Inter', sans-serif" font-size="10.5" font-weight="700" fill="#1d4ed8" letter-spacing="0.5">
    TEAM
  </text>
  
  <text x="77" y="62" font-family="'Inter', -apple-system, sans-serif" font-size="9.5" font-weight="600" fill="#64748b" letter-spacing="1.2">
    AI SEARCH VISIBILITY &amp; TECH SEO
  </text>
</svg>
